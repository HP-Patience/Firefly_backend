<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑内容 - Firefly Hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/workspace.css" />
    <link rel="stylesheet" href="/workspace-fixes.css" />
    <link rel="stylesheet" href="/editor.css" />
    <link rel="stylesheet" href="/editor-fixes.css" />
  </head>
  <body class="editor-page">
    <header class="editor-header"><div class="editor-file"><span class="file-icon">▤</span><strong id="editor-filename">加载中...</strong><span class="file-size" id="editor-size">--</span></div><div class="editor-actions"><button id="back-button">▣ 返回列表</button><button id="fullscreen-button">□ 全屏模式</button><button id="save-button" class="save-button">▣ 保存文章</button><button id="delete-button" class="delete-button">⌫ 删除文章</button></div></header>
    <section class="editor-toolbar"><div class="editor-modes"><button id="edit-mode" class="mode-button active">▧ 编辑</button><button id="preview-mode" class="mode-button">◉ 预览</button><span class="line-count" id="line-count">0 行</span></div><div class="format-tools"><button data-wrap="# " title="一级标题">H1</button><button data-wrap="## " title="二级标题">H2</button><button data-wrap="### " title="三级标题">H3</button><i></i><button data-pair="**" title="粗体">B</button><button data-pair="*" title="斜体"><em>I</em></button><button data-pair="`" title="行内代码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg></button><i></i><button data-prefix="- " title="无序列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button data-prefix="1. " title="有序列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M3 5h1v3M3 11h2l-2 3h2M3 17h2l-2 3h2"/></svg></button><button data-pair="[]()" title="链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 15 6-6M7 17H5a4 4 0 0 1 0-8h3M17 7h2a4 4 0 0 1 0 8h-3"/></svg></button><button data-image title="图片"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 2-2 6 6"/></svg></button><button data-table title="表格"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg></button><button data-pair="`" title="代码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg></button><button data-prefix="> " title="引用"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h5v5H5zM14 11h5v5h-5zM5 16c0-5 1-7 5-8M14 16c0-5 1-7 5-8"/></svg></button><button data-prefix="---\n" title="分隔线"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/></svg></button></div></section>
    <main class="editor-main"><aside class="line-numbers" id="line-numbers">1</aside><textarea id="editor-textarea" spellcheck="false" aria-label="Markdown 编辑器"></textarea><article id="editor-preview" class="editor-preview hidden"></article></main>
    <div class="editor-status" id="editor-status"></div>
    <script src="/editor.js"></script>
  </body>
</html>
