<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑内容 - Firefly Hub</title>
    <meta name="description" content="Firefly Markdown 文章编辑器与实时预览" />
    <link rel="stylesheet" href="/vendor/geist/index.css" />
    <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/workspace.css" />
    <link rel="stylesheet" href="/workspace-fixes.css" />
    <link rel="stylesheet" href="/editor.css" />
    <link rel="stylesheet" href="/editor-fixes.css" />
    <link rel="stylesheet" href="/polish.css" />
    <link rel="stylesheet" href="/precision-components.css" />
    <link rel="stylesheet" href="/fonts-icons.css" />
    <link rel="stylesheet" href="/math.css" />
  </head>
  <body class="editor-page">
    <a class="skip-link" href="#editor-textarea">跳到编辑器</a>
    <header class="editor-header"><div class="editor-file"><i class="ph ph-file-text file-icon" aria-hidden="true"></i><strong id="editor-filename">加载中...</strong><span class="file-size" id="editor-size">--</span></div><div class="editor-actions"><button id="back-button"><i class="ph ph-article" aria-hidden="true"></i>返回列表</button><button id="fullscreen-button"><i class="ph ph-arrows-out" aria-hidden="true"></i>全屏模式</button><button id="external-button"><i class="ph ph-arrow-square-out" aria-hidden="true"></i>外部编辑器</button><button id="save-button" class="save-button"><i class="ph ph-floppy-disk" aria-hidden="true"></i>保存文章</button><button id="delete-button" class="delete-button"><i class="ph ph-trash" aria-hidden="true"></i>删除文章</button></div></header>
    <section class="editor-toolbar"><div class="editor-modes"><span class="line-count" id="line-count">0 行</span></div><div class="format-tools"><button data-wrap="# " title="一级标题">H1</button><button data-wrap="## " title="二级标题">H2</button><button data-wrap="### " title="三级标题">H3</button><i></i><button data-pair="**" title="粗体">B</button><button data-pair="*" title="斜体"><em>I</em></button><button data-pair="`" title="行内代码"><i class="ph ph-code" aria-hidden="true"></i></button><i></i><button data-prefix="- " title="无序列表"><i class="ph ph-list-bullets" aria-hidden="true"></i></button><button data-prefix="1. " title="有序列表"><i class="ph ph-list-numbers" aria-hidden="true"></i></button><button data-pair="[]()" title="链接"><i class="ph ph-link" aria-hidden="true"></i></button><button data-image title="图片"><i class="ph ph-image" aria-hidden="true"></i></button><button data-table title="表格"><i class="ph ph-table" aria-hidden="true"></i></button><button data-pair="`" title="代码"><i class="ph ph-terminal" aria-hidden="true"></i></button><button data-prefix="> " title="引用"><i class="ph ph-quotes" aria-hidden="true"></i></button><button data-prefix="---\n" title="分隔线"><i class="ph ph-minus" aria-hidden="true"></i></button></div></section>
    <div class="pane-headings"><span>源文件</span><span>实时预览</span></div><main class="editor-main"><aside class="line-numbers" id="line-numbers">1</aside><textarea id="editor-textarea" spellcheck="false" aria-label="Markdown 编辑器"></textarea><article id="editor-preview" class="editor-preview hidden"></article></main>
    <input id="image-upload" type="file" accept="image/*" hidden />
    <div class="editor-status" id="editor-status"></div>
    <dialog class="action-dialog" id="editor-action-dialog"><form method="dialog"><header><span class="dialog-kicker">DELETE SOURCE FILE</span><h2>删除文章</h2><p id="editor-action-message"></p></header><menu><button value="cancel" class="secondary">取消</button><button value="confirm" class="danger-button">删除源文件</button></menu></form></dialog>
    <script src="/editor.js"></script>
  </body>
</html>
