<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firefly 内容后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">✦</span><span>FIREFLY <small>CONTENT STUDIO</small></span></div>
        <nav><button class="nav-item active" data-filter="all">总览 <span id="all-count">0</span></button><button class="nav-item" data-filter="article">文章 <span id="article-count">0</span></button><button class="nav-item" data-filter="dynamic">动态 <span id="dynamic-count">0</span></button><button class="nav-item" data-filter="draft">草稿 <span id="draft-count">0</span></button></nav>
        <div class="sidebar-foot">本地内容工作区<br /><span>所有数据保存在当前目录</span></div>
      </aside>
      <main class="main">
        <header class="topbar"><div><p class="eyebrow">CONTENT WORKSPACE / 01</p><h1 id="page-title">内容总览</h1></div><button class="primary" id="new-button">＋ 新建内容</button></header>
        <section class="project-bar" id="project-bar"><div class="project-state"><span class="connection-dot"></span><div><strong id="project-name">尚未连接 Firefly</strong><p id="project-path">选择博客项目文件夹后，即可读取真实文章、动态和图片资源</p></div></div><div class="project-metrics hidden" id="project-metrics"><span><b id="project-articles">0</b> 篇文章</span><span><b id="project-dynamics">0</b> 条动态</span><span><b id="project-resources">0</b> 个资源</span></div><button class="connect-button" id="select-project">选择文件夹</button></section>
        <section class="stats"><div><span>全部内容</span><strong id="stat-total">0</strong></div><div><span>已发布</span><strong id="stat-published">0</strong></div><div><span>待创作草稿</span><strong id="stat-drafts">0</strong></div><div><span>最近更新</span><strong id="stat-latest">暂无</strong></div></section>
        <section class="toolbar"><div class="tabs"><button class="tab active" data-status="all">全部</button><button class="tab" data-status="published">已发布</button><button class="tab" data-status="draft">草稿</button></div><input id="search" type="search" placeholder="搜索标题或正文..." /></section>
        <section id="content-list" class="content-list"></section>
      </main>
    </div>
    <div class="modal hidden" id="editor-modal"><div class="modal-panel"><header class="modal-head"><div><p class="eyebrow">EDITOR / LOCAL ONLY</p><h2 id="editor-title">新建内容</h2></div><button class="icon-button" id="close-editor" aria-label="关闭">×</button></header><form id="editor-form"><div class="type-switch"><label><input type="radio" name="type" value="article" checked />文章</label><label><input type="radio" name="type" value="dynamic" />动态</label></div><div class="field"><label for="title">标题 <span id="title-hint">文章标题</span></label><input id="title" required placeholder="给这次创作一个名字" /></div><div class="field article-only"><label for="description">摘要</label><input id="description" placeholder="一句话说明这篇文章" /></div><div class="field article-only"><label for="category">分类</label><input id="category" placeholder="例如：技术、随笔" /></div><div class="field article-only"><label for="tags">标签</label><input id="tags" placeholder="用逗号分隔，例如：Astro, 写作" /></div><div class="field"><label for="content">正文 <button type="button" class="preview-toggle" id="preview-toggle">预览</button></label><textarea id="content" required placeholder="从这里开始写..." spellcheck="false"></textarea><article class="markdown-preview hidden" id="markdown-preview"></article></div><div class="form-actions"><button type="button" class="secondary" id="save-draft">保存草稿</button><button type="submit" class="primary">发布内容</button></div></form></div></div>
    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
