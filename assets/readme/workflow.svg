<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Firefly Hub content workflow</title>
  <desc id="desc">Markdown articles and dynamics move through Firefly Hub into the Firefly source repository, Astro build, and a separate dist repository.</desc>

  <rect x="1" y="1" width="1198" height="358" rx="18" fill="#151918" stroke="#313b36" stroke-width="2"/>
  <text x="54" y="60" fill="#8fa59a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">CONTENT PIPELINE / EXPLICIT STEPS</text>
  <text x="54" y="104" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="38" font-weight="740">From local draft to static output</text>

  <g id="flow" transform="translate(54 148)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g>
      <rect width="190" height="130" rx="8" fill="#202825" stroke="#53645b" stroke-width="2"/>
      <text x="20" y="38" fill="#9eb3a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01 / WRITE</text>
      <text x="20" y="76" fill="#ffffff" font-size="23" font-weight="700">Markdown</text>
      <text x="20" y="106" fill="#aebbb5" font-size="18">Posts + dynamics</text>
    </g>

    <path d="M202 65H228" stroke="#6f8379" stroke-width="3"/>
    <path d="M220 56L230 65L220 74" fill="none" stroke="#6f8379" stroke-width="3"/>

    <g transform="translate(242 0)">
      <rect width="210" height="130" rx="8" fill="#e7f1eb" stroke="#88a496" stroke-width="2"/>
      <text x="20" y="38" fill="#246347" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02 / CONTROL</text>
      <text x="20" y="76" fill="#17201c" font-size="24" font-weight="740">Firefly Hub</text>
      <text x="20" y="106" fill="#516159" font-size="17">Preview · state · backup</text>
    </g>

    <path d="M464 65H490" stroke="#6f8379" stroke-width="3"/>
    <path d="M482 56L492 65L482 74" fill="none" stroke="#6f8379" stroke-width="3"/>

    <g transform="translate(504 0)">
      <rect width="200" height="130" rx="8" fill="#202825" stroke="#53645b" stroke-width="2"/>
      <text x="20" y="38" fill="#9eb3a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03 / SOURCE</text>
      <text x="20" y="76" fill="#ffffff" font-size="23" font-weight="700">Firefly repo</text>
      <text x="20" y="106" fill="#aebbb5" font-size="16">status · add · commit</text>
    </g>

    <path d="M716 65H742" stroke="#6f8379" stroke-width="3"/>
    <path d="M734 56L744 65L734 74" fill="none" stroke="#6f8379" stroke-width="3"/>

    <g transform="translate(756 0)">
      <rect width="130" height="130" rx="8" fill="#202825" stroke="#53645b" stroke-width="2"/>
      <text x="18" y="38" fill="#9eb3a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04</text>
      <text x="18" y="76" fill="#ffffff" font-size="23" font-weight="700">Build</text>
      <text x="18" y="106" fill="#aebbb5" font-size="17">Astro SSG</text>
    </g>

    <path d="M898 65H924" stroke="#6f8379" stroke-width="3"/>
    <path d="M916 56L926 65L916 74" fill="none" stroke="#6f8379" stroke-width="3"/>

    <g transform="translate(938 0)">
      <rect width="154" height="130" rx="8" fill="#246347" stroke="#6fa289" stroke-width="2"/>
      <text x="18" y="38" fill="#cbe1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">05 / SHIP</text>
      <text x="18" y="76" fill="#ffffff" font-size="24" font-weight="740">dist repo</text>
      <text x="18" y="106" fill="#dcece4" font-size="17">fetch · push</text>
    </g>
  </g>

  <text x="1146" y="328" text-anchor="end" fill="#74847c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">EXPLICIT COMMIT / EXPLICIT DEPLOY</text>
</svg>
