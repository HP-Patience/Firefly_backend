<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Firefly Hub</title>
  <desc id="desc">A local content workspace connecting Markdown writing, live preview, content status, Git source, and static build output.</desc>

  <rect x="1" y="1" width="1198" height="398" rx="18" fill="#f7f9f8" stroke="#dce2de" stroke-width="2"/>
  <path d="M0 76H1200M720 76V400" stroke="#dce2de" stroke-width="2"/>

  <g id="identity" transform="translate(58 44)">
    <circle cx="10" cy="10" r="8" fill="#246347"/>
    <circle cx="10" cy="10" r="3" fill="#f7f9f8"/>
    <text x="32" y="17" fill="#66726c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">LOCAL CONTENT WORKSPACE / FIREFLY</text>

    <text x="0" y="116" fill="#151918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="72" font-weight="760">Firefly Hub</text>
    <text x="0" y="164" fill="#3f4b45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="500">Write, preview, publish, and ship from one local desk.</text>

    <g transform="translate(0 220)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <path d="M12 0V82M12 16H34M12 50H34M12 82H34" fill="none" stroke="#9eb3a8" stroke-width="2"/>
      <circle cx="12" cy="16" r="6" fill="#246347"/>
      <circle cx="12" cy="50" r="6" fill="#ffffff" stroke="#246347" stroke-width="2"/>
      <circle cx="12" cy="82" r="6" fill="#151918"/>
      <text x="50" y="23" fill="#151918">Markdown source</text>
      <text x="50" y="57" fill="#151918">Live rendered proof</text>
      <text x="50" y="89" fill="#151918">Source + dist repositories</text>
    </g>
  </g>

  <g id="workspace-proof" transform="translate(758 104)">
    <rect width="384" height="248" rx="10" fill="#ffffff" stroke="#bcc8c1" stroke-width="2"/>
    <rect x="0" y="0" width="384" height="42" rx="10" fill="#eef2f0"/>
    <path d="M0 42H384M150 42V248" stroke="#dce2de" stroke-width="2"/>
    <circle cx="24" cy="21" r="6" fill="#246347"/>
    <text x="42" y="28" fill="#151918" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">index.md</text>

    <g transform="translate(20 70)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="0" fill="#246347" font-size="21" font-weight="700"># Publish</text>
      <rect x="0" y="20" width="108" height="8" rx="4" fill="#c7d5ce"/>
      <rect x="0" y="40" width="84" height="8" rx="4" fill="#dce2de"/>
      <text x="0" y="84" fill="#66726c" font-size="18">draft: false</text>
      <rect x="0" y="110" width="96" height="30" rx="5" fill="#e7f1eb"/>
      <text x="14" y="131" fill="#246347" font-size="17" font-weight="700">SAVED</text>
    </g>

    <g transform="translate(174 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="0" y="0" fill="#151918" font-size="24" font-weight="740">Live preview</text>
      <rect x="0" y="20" width="174" height="10" rx="5" fill="#151918"/>
      <rect x="0" y="44" width="158" height="7" rx="3.5" fill="#bcc8c1"/>
      <rect x="0" y="62" width="176" height="7" rx="3.5" fill="#dce2de"/>
      <rect x="0" y="80" width="132" height="7" rx="3.5" fill="#dce2de"/>
      <rect x="0" y="108" width="176" height="64" rx="6" fill="#f0f3f1" stroke="#dce2de"/>
      <path d="M18 153L50 127L72 145L104 116L158 153" fill="none" stroke="#246347" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="1142" y="380" text-anchor="end" fill="#8c9691" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">NODE 22+ / LOCAL FIRST</text>
</svg>
